<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entry/Exit Board: dashboard concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f6f5f2; --surface:#fcfcfb; --surface-2:#f0efec; --line:#e4e3de; --line-2:#d3d2cc;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#6b6a65;
  --b1:#1c5cab; --b2:#3987e5; --b3:#9ec5f4; --b4:#d3d2cc; --b5:#f0a09f; --b6:#c93a3a;
  --s1:#6250d6; --s2:#eb6834; --s3:#1baf7a; --s4:#b07a00; --s5:#d55181;
  --accent:#0b0b0b; --focus:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root{color-scheme:dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --line:#2e2e2c; --line-2:#44443f;
  --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#9d9c94;
  --b1:#5598e7; --b2:#3987e5; --b3:#1c5cab; --b4:#55554f; --b5:#a84545; --b6:#e66767;
  --s1:#9085e9; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --accent:#f0efec;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1}
button{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:20px 24px 60px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:22px;letter-spacing:-.01em;margin:0}
.sub{color:var(--ink-2);font-size:14px;margin-top:2px}
.scale{display:flex;gap:2px;align-items:stretch;font-size:12px}
.scale div{padding:4px 8px;border-radius:4px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink-2)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
nav a{padding:9px 12px;text-decoration:none;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav a.on{color:var(--ink);border-color:var(--ink)}
nav a:hover{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-size:14px;margin:0 0 2px;font-weight:600}
.card .hint{color:var(--ink-3);font-size:12px;margin:0 0 12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.score{font-weight:600;min-width:34px;text-align:right;display:inline-block}
.row{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--surface-2)}
.row .nm{flex:1 1 auto;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;color:var(--ink-3);white-space:nowrap}
.row .tag{flex:0 1 auto;max-width:48%;overflow:hidden;text-overflow:ellipsis}
.grid>*{min-width:0}
.tier{font-size:12px;font-weight:600;border:1px solid var(--line-2);border-radius:4px;padding:0 4px;color:var(--ink-2)}
.tier.A{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tier.C{border-style:dashed}
.more{font-size:12px;color:var(--ink-3);padding:2px 6px}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:10px 6px 2px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em}
.kpi .l{font-size:12px;color:var(--ink-2)}
.dist{display:flex;height:14px;gap:2px;margin:6px 0 4px}
.dist div{border-radius:3px}
.chg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:900px){.chg{grid-template-columns:1fr 1fr}}
.chgc{border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.chgc:hover{border-color:var(--line-2);background:var(--surface-2)}
.chgc .n{font-weight:600}.chgc .t{font-size:12px;color:var(--ink-2)}
.moved{font-size:12px;font-weight:600;padding:1px 6px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters #q{padding:7px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink);min-width:220px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--surface)}
svg text{fill:var(--ink-2);font-size:12px}
.tt{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:8px 10px;border-radius:6px;font-size:12px;max-width:280px;z-index:50;display:none;line-height:1.4}
.tt b{font-weight:600}
.drawer{overflow-x:hidden;position:fixed;top:0;right:0;height:100%;width:420px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.08);transform:translateX(105%);transition:transform .2s ease;z-index:40;overflow-y:auto;padding:20px}
.drawer.open{transform:none}
.drawer .x{position:absolute;right:14px;top:14px;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:2px 9px;cursor:pointer}
.big{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--ink-2)}
.note{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:8px 10px;margin-top:8px}
.warn{border-left:3px solid #fab219}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:18px 0 8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;border-bottom:1px solid var(--line-2);padding:6px 8px}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
.prose{max-width:820px}
.prose p,.prose li{color:var(--ink-2)}
.prose h2{font-size:16px;margin:22px 0 6px;color:var(--ink)}
.prose strong{color:var(--ink)}
.know{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.know{grid-template-columns:1fr}}
.klist{display:flex;flex-direction:column;gap:2px}
.kitem{display:flex;flex-direction:column;gap:2px;padding:8px;border-radius:6px;text-decoration:none;color:var(--ink);border-left:2px solid transparent}
.kitem:hover{background:var(--surface-2)}
.kitem.on{background:var(--surface-2);border-left-color:var(--ink)}
.kitem .kt{font-weight:500;line-height:1.3}
.kitem .km{font-size:12px;color:var(--ink-3)}
.kbody{max-width:none;min-width:0}
.kbody h1{font-size:22px;margin:0 0 10px;letter-spacing:-.01em}
.kbody h3{font-size:14px;margin:16px 0 4px;color:var(--ink)}
.kbody a{color:var(--focus)}
.kbody blockquote{margin:12px 0;padding:8px 12px;border-left:3px solid var(--line-2);background:var(--surface-2);border-radius:4px}
.kbody blockquote p{margin:0}
.kbody table{display:block;overflow-x:auto;margin:8px 0}
.kbody code{font-size:12px;background:var(--surface-2);padding:1px 4px;border-radius:3px}
.toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;background:var(--surface)}
.toggle.off{opacity:.45}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:6px 0}
.pill{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;border:1px solid var(--line-2);color:var(--ink-2)}
.pill.on{background:#0ca30c22;border-color:#0ca30c;color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.legendbar{display:grid;grid-template-columns:repeat(6,auto);gap:2px;font-size:12px;color:var(--ink-2);min-width:420px}
.legendbar span{display:block;height:6px;border-radius:2px;margin-bottom:3px}
.legendbar div{text-align:left}
.fresh{font-size:12px;color:var(--ink-2);margin-top:4px}
.brief{padding:20px 22px;margin-bottom:14px}
.brief .lede{font-size:19px;line-height:1.4;font-weight:500;letter-spacing:-.01em;max-width:900px;margin:2px 0 12px}
.brief .lede b{font-weight:600}
.moves{display:flex;gap:8px;flex-wrap:wrap}
.move{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:16px;padding:4px 10px;font-size:12px;cursor:pointer;background:var(--surface)}
.move:hover{background:var(--surface-2)}
.conf{display:inline-flex;gap:2px;align-items:center}
.conf i{width:5px;height:5px;border-radius:50%;background:var(--ink-2);display:inline-block}
.conf i.o{background:transparent;box-shadow:inset 0 0 0 1px var(--ink-3)}
.held{font-size:12px;font-weight:600;color:var(--surface);background:var(--ink);border-radius:4px;padding:1px 5px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:500;font-size:12px;color:var(--ink)}
.btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.empty{font-size:12px;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:8px;padding:10px 12px;margin:4px 0 8px}
.temp{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:8px;background:var(--surface);padding:6px 10px;z-index:99}
.dot:focus{outline:none}.dot:focus circle:last-of-type{stroke:var(--focus);stroke-width:3}
@media (prefers-reduced-motion: reduce){.drawer{transition:none}}
th .btn{border:0;background:none;padding:0;font-size:12px;color:var(--ink-2);font-weight:600;text-decoration:underline dotted}
.drawer .tag{white-space:normal}
td.nw{white-space:nowrap}
.bstrip{display:inline-flex;gap:2px;flex:none;min-width:38px}.bstrip i{width:8px;height:12px;border-radius:2px;display:inline-block}
.cbar{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--surface-2);flex:none;overflow:hidden}.cbar i{display:block;height:100%;border-radius:3px}
.mom{font-size:12px;color:var(--ink-2);white-space:nowrap;flex:none}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media(max-width:1000px){.lanes{grid-template-columns:1fr 1fr}}
.lane{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 10px;min-width:0}
.lane h3{margin:0 0 2px;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);display:flex;justify-content:space-between}
.lane .hint{margin-bottom:8px}
.lc{border-top:1px solid var(--line);padding:7px 2px;cursor:pointer}
.lc:hover{background:var(--surface-2)}
.lc .top{display:flex;justify-content:space-between;gap:6px;font-size:14px}
.lc .top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc .bot{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--ink-3)}
.rank{display:grid;grid-template-columns:22px 1fr auto auto auto 44px;gap:8px;align-items:center;padding:6px 4px;border-top:1px solid var(--line);cursor:pointer}
.rank:hover{background:var(--surface-2)}
.rank .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .cv{font-weight:600;text-align:right}
.stat{font-size:12px;font-weight:600;border-radius:10px;padding:1px 8px;border:1px solid var(--line-2);white-space:nowrap}
.stat.ok{border-color:#0ca30c;color:var(--ink)}.stat.due{border-color:#fab219}.stat.stale{border-color:#d03b3b;background:#d03b3b18}
.loading{padding:60px;text-align:center;color:var(--ink-2)}

/* ---- asset-class tabs ---- */
nav .navx{margin-left:auto;display:flex;gap:2px}nav .navx a{font-size:12px;color:var(--ink-3)}
.tabhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:2px 0 10px}
.tabt{font-size:22px;margin:0;letter-spacing:-.01em}.tabs{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.tabmix{min-width:200px;flex:0 1 280px}.tabmix .mix{margin-bottom:3px}
.tbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;padding:4px;background:var(--surface-2);border-radius:8px;width:max-content;max-width:100%}
.tbar a{padding:6px 12px;border-radius:6px;text-decoration:none;color:var(--ink-2);font-size:14px;font-weight:500}
.tbar a.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}.tbar a:hover{color:var(--ink)}
.mix{display:flex;gap:1px;border-radius:3px;overflow:hidden;background:var(--surface-2)}.mix i{display:block;height:100%}
.gauge{display:block;margin:4px 0}
.tiles7{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media(max-width:1100px){.tiles7{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:640px){.tiles7{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}@media(max-width:760px){.tiles3{grid-template-columns:1fr}}
.at{display:block;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--line-2);border-radius:10px;padding:12px;text-decoration:none;color:var(--ink);cursor:pointer;min-width:0}
.at:hover{background:var(--surface-2)}.at .gauge{max-width:100%}
.atl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600}
.atv{font-size:30px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;line-height:1.2}.atv .chip{font-size:12px}
.ats{font-size:12px;color:var(--ink-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.at .mix{height:6px;margin-top:6px}
.hero{border-top:4px solid var(--line-2)}.herorow{display:flex;align-items:flex-end;gap:14px;margin:6px 0 2px}
.bk{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.bk div{border-radius:6px;padding:5px 9px;display:flex;flex-direction:column;min-width:78px}
.bk span{font-size:12px;color:var(--ink-2)}.bk b{font-size:16px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}.heat.sm{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:4px}
.ht{border:1px solid var(--line);border-left-width:4px;border-radius:6px;padding:7px 8px;cursor:pointer;min-width:0}
.ht:hover{outline:2px solid var(--ink-3)}.htn{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hts{display:flex;align-items:baseline;justify-content:space-between;gap:6px}.hts b{font-size:18px}.hts span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat.sm .hts b{font-size:16px}
.tscroll{overflow-x:auto}td.hc{text-align:right;font-variant-numeric:tabular-nums}
table.st th .btn{white-space:nowrap}
/* ---- Indian equities: top-down / bottom-up ---- */
.vbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px}.vsw.seg button{padding:8px 16px;font-size:14px;font-weight:500}
.step{display:flex;align-items:center;gap:8px;margin:6px 0 8px;font-size:12px}
.step span{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2);font-size:12px}
table.hm{border-collapse:separate;border-spacing:2px;width:100%;min-width:560px;table-layout:fixed}table.hm thead th:first-child{width:28%}
table.hm .btn{text-decoration:none}
table.hm th,table.hm td{border:0;padding:0}
table.hm thead .btn{width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:transparent;padding:4px 2px;font-size:12px}
table.hm tbody th .btn{border:0;background:transparent;text-align:left;font-weight:500;padding:6px 6px 6px 0;white-space:nowrap;font-size:12px}
.hmcell{width:100%;min-height:30px;border:1px solid var(--line);border-radius:4px;font:inherit;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.hmcell:disabled{cursor:default;color:var(--ink-3)!important;font-weight:400}
.hmcell:not(:disabled):hover,.hmcell.on{outline:2px solid var(--ink);outline-offset:-1px}
.hmleg{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:8px}.hmleg i{width:22px;height:10px;border-radius:2px;border:1px solid var(--line)}
.hmleg .tag{white-space:normal}
.heat.opp{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.pill.sp{font-size:12px;padding:0 5px}
.sbar{display:flex;height:24px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.sbar i{display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden}
.rotrow{display:grid;grid-template-columns:120px 1fr 52px;gap:10px;align-items:center;margin:8px 0}
.rotl{display:flex;flex-direction:column}.rotv{text-align:right;font-size:16px}
.rotbar{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--b1),var(--line) 50%,var(--s1))}
.rotbar i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.rotax{display:flex;justify-content:space-between;margin-top:3px}
@media(max-width:640px){.rotrow{grid-template-columns:90px 1fr 46px}}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:6px}.sgh{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;margin-bottom:4px}
.warnrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}@media(max-width:640px){.warnrow{grid-template-columns:1fr}}
.wv{font-size:26px;font-weight:600}.wv span{font-size:12px;color:var(--ink-3);font-weight:400}
.mixt td{vertical-align:middle}.mixt a{color:var(--ink);text-decoration:none}
.hb{display:flex;flex-direction:column;gap:6px}.hbr{display:grid;grid-template-columns:minmax(0,190px) 1fr 56px;gap:8px;align-items:center;cursor:pointer;font-size:12px}
.hbn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hbt{background:var(--surface-2);border-radius:4px;height:14px;overflow:hidden}.hbt i{display:block;height:100%;border-radius:4px}.hbv{text-align:right;font-weight:600}
.rules{margin:6px 0 0 18px;padding:0;color:var(--ink-2)}.rules li{margin-bottom:6px}.rules b{color:var(--ink)}
.ddbar{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin:4px 0}.ddbar i{display:block;height:100%;background:var(--b6)}
.dtools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-4px 0 12px}.dtools .btn{text-decoration:none;font-size:12px;padding:4px 9px}
.klinks{display:flex;flex-direction:column;gap:2px}
.card>table{display:block;overflow-x:auto}
@media(max-width:640px){.legendbar{min-width:0;width:100%;grid-template-columns:repeat(3,1fr)}header{gap:10px}.wrap{padding:14px 16px 50px}.tabmix{flex-basis:100%}.big{font-size:34px}}

/* ---- design pass: legend, tools menu, verdict, extremes, score cell, phones ---- */
.legendbar .lbl{font-weight:400;display:block}.legendbar .rng{font-style:normal;color:var(--ink-3);display:block}
.tmenu{position:relative}.tmenu summary{list-style:none;padding:6px 12px;border-radius:6px;color:var(--ink-2);font-size:14px;font-weight:500;cursor:pointer}

.tlist{position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:180px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.14);display:flex;flex-direction:column}
.tlist a{padding:9px 12px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:14px}.tlist a:hover,.tlist a.on{background:var(--surface-2)}

.xstats{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);align-items:center}.xstats b{color:var(--ink);font-size:14px}.xstats a{color:var(--ink-2)}

.xnote{cursor:pointer;white-space:normal;padding:4px 0}td.sc .sw{margin-right:6px;vertical-align:-1px}
@media(max-width:640px){

  th .btn{min-height:40px}td{padding:10px 8px}.row{padding:10px 6px}
  table.st .mh{display:none}
  .verdict{flex-direction:column;gap:4px}
  .tlist{position:fixed;left:16px;right:16px;top:auto;min-width:0}

}

/* ---- side panel: header + tabs, and push layout on wide screens ---- */
.drawer{width:440px;padding:0;display:flex;flex-direction:column}
.dhead{position:sticky;top:0;z-index:2;background:var(--surface);padding:16px 20px 0;border-bottom:1px solid var(--line)}
.dhead .x{position:absolute;right:14px;top:14px}
.dhead #drh{margin:4px 40px 8px 0;font-size:18px;line-height:1.25}
.dscore{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.dscore .big{font-size:40px}.dscore .tag{display:block;white-space:normal}
.dhold{margin-left:auto}
.dhead .dtools{margin:8px 0 0}
.dtabs{display:flex;gap:2px;margin-top:10px}

.dtabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.dbody{padding:16px 20px 28px}
.dsec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.dsec h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600}
.dsec.plain{border:0;padding:0}.dsec.warnbox{border-left:3px solid #fab219}
.dact{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14px}.dact span{display:block;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:2px}
.dsig{display:flex;align-items:center;gap:10px;margin-bottom:10px}.dsig b{font-size:26px}
.mstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mstat{background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:0}.mstat span{display:block;font-size:12px;color:var(--ink-3)}.mstat b{font-size:16px}.mstat em{display:block;font-style:normal;font-size:12px;color:var(--ink-2)}
.dnote{margin-top:8px;white-space:normal}
.dsec .kv{grid-template-columns:140px 1fr}
body{transition:padding-right .2s ease}
