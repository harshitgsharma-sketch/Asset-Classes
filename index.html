<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entry/Exit Board: dashboard concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f6f5f2; --surface:#fcfcfb; --surface-2:#f0efec; --line:#e4e3de; --line-2:#d3d2cc;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#6b6a65;
  --b1:#1c5cab; --b2:#3987e5; --b3:#9ec5f4; --b4:#d3d2cc; --b5:#f0a09f; --b6:#c93a3a;
  --s1:#6250d6; --s2:#eb6834; --s3:#1baf7a; --s4:#b07a00; --s5:#d55181;
  --accent:#0b0b0b; --focus:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root{color-scheme:dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --line:#2e2e2c; --line-2:#44443f;
  --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#9d9c94;
  --b1:#5598e7; --b2:#3987e5; --b3:#1c5cab; --b4:#55554f; --b5:#a84545; --b6:#e66767;
  --s1:#9085e9; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --accent:#f0efec;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1}
button{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:20px 24px 60px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:22px;letter-spacing:-.01em;margin:0}
.sub{color:var(--ink-2);font-size:13px;margin-top:2px}
.scale{display:flex;gap:2px;align-items:stretch;font-size:11px}
.scale div{padding:4px 8px;border-radius:4px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink-2)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
nav a{padding:9px 12px;text-decoration:none;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav a.on{color:var(--ink);border-color:var(--ink)}
nav a:hover{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-size:14px;margin:0 0 2px;font-weight:600}
.card .hint{color:var(--ink-3);font-size:12px;margin:0 0 12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.score{font-weight:600;min-width:34px;text-align:right;display:inline-block}
.row{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--surface-2)}
.row .nm{flex:1 1 auto;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;color:var(--ink-3);white-space:nowrap}
.row .tag{flex:0 1 auto;max-width:48%;overflow:hidden;text-overflow:ellipsis}
.grid>*{min-width:0}
.tier{font-size:10px;font-weight:600;border:1px solid var(--line-2);border-radius:4px;padding:0 4px;color:var(--ink-2)}
.tier.A{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tier.C{border-style:dashed}
.more{font-size:12px;color:var(--ink-3);padding:2px 6px}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:10px 6px 2px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em}
.kpi .l{font-size:12px;color:var(--ink-2)}
.dist{display:flex;height:14px;gap:2px;margin:6px 0 4px}
.dist div{border-radius:3px}
.chg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:900px){.chg{grid-template-columns:1fr 1fr}}
.chgc{border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.chgc:hover{border-color:var(--line-2);background:var(--surface-2)}
.chgc .n{font-weight:600}.chgc .t{font-size:12px;color:var(--ink-2)}
.moved{font-size:11px;font-weight:600;padding:1px 6px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters #q{padding:7px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink);min-width:220px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--surface)}
svg text{fill:var(--ink-2);font-size:11px}
.tt{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:8px 10px;border-radius:6px;font-size:12px;max-width:280px;z-index:50;display:none;line-height:1.4}
.tt b{font-weight:600}
.drawer{overflow-x:hidden;position:fixed;top:0;right:0;height:100%;width:420px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.08);transform:translateX(105%);transition:transform .2s ease;z-index:40;overflow-y:auto;padding:20px}
.drawer.open{transform:none}
.drawer .x{position:absolute;right:14px;top:14px;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:2px 9px;cursor:pointer}
.big{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:13px}
.kv div:nth-child(odd){color:var(--ink-2)}
.note{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:8px 10px;margin-top:8px}
.warn{border-left:3px solid #fab219}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:18px 0 8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;border-bottom:1px solid var(--line-2);padding:6px 8px}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
.prose{max-width:820px}
.prose p,.prose li{color:var(--ink-2)}
.prose h2{font-size:16px;margin:22px 0 6px;color:var(--ink)}
.prose strong{color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;background:var(--surface)}
.toggle.off{opacity:.45}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:6px 0}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line-2);color:var(--ink-2)}
.pill.on{background:#0ca30c22;border-color:#0ca30c;color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.legendbar{display:grid;grid-template-columns:repeat(6,auto);gap:2px;font-size:11px;color:var(--ink-2);min-width:420px}
.legendbar span{display:block;height:6px;border-radius:2px;margin-bottom:3px}
.legendbar div{text-align:left}
.fresh{font-size:12px;color:var(--ink-2);margin-top:4px}
.brief{padding:20px 22px;margin-bottom:14px}
.brief .lede{font-size:19px;line-height:1.4;font-weight:500;letter-spacing:-.01em;max-width:900px;margin:2px 0 12px}
.brief .lede b{font-weight:600}
.moves{display:flex;gap:8px;flex-wrap:wrap}
.move{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:16px;padding:4px 10px;font-size:12px;cursor:pointer;background:var(--surface)}
.move:hover{background:var(--surface-2)}
.conf{display:inline-flex;gap:2px;align-items:center}
.conf i{width:5px;height:5px;border-radius:50%;background:var(--ink-2);display:inline-block}
.conf i.o{background:transparent;box-shadow:inset 0 0 0 1px var(--ink-3)}
.held{font-size:10px;font-weight:600;color:var(--surface);background:var(--ink);border-radius:4px;padding:1px 5px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:500;font-size:12px;color:var(--ink)}
.btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.empty{font-size:12px;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:8px;padding:10px 12px;margin:4px 0 8px}
.temp{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:8px;background:var(--surface);padding:6px 10px;z-index:99}
.dot:focus{outline:none}.dot:focus circle:last-of-type{stroke:var(--focus);stroke-width:3}
@media (prefers-reduced-motion: reduce){.drawer{transition:none}}
th .btn{border:0;background:none;padding:0;font-size:12px;color:var(--ink-2);font-weight:600;text-decoration:underline dotted}
.drawer .tag{white-space:normal}
td.nw{white-space:nowrap}
.bstrip{display:inline-flex;gap:2px;flex:none;min-width:38px}.bstrip i{width:8px;height:12px;border-radius:2px;display:inline-block}
.cbar{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--surface-2);flex:none;overflow:hidden}.cbar i{display:block;height:100%;border-radius:3px}
.mom{font-size:11px;color:var(--ink-2);white-space:nowrap;flex:none}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media(max-width:1000px){.lanes{grid-template-columns:1fr 1fr}}
.lane{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 10px;min-width:0}
.lane h3{margin:0 0 2px;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);display:flex;justify-content:space-between}
.lane .hint{margin-bottom:8px}
.lc{border-top:1px solid var(--line);padding:7px 2px;cursor:pointer}
.lc:hover{background:var(--surface-2)}
.lc .top{display:flex;justify-content:space-between;gap:6px;font-size:13px}
.lc .top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc .bot{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;color:var(--ink-3)}
.rank{display:grid;grid-template-columns:22px 1fr auto auto auto 44px;gap:8px;align-items:center;padding:6px 4px;border-top:1px solid var(--line);cursor:pointer}
.rank:hover{background:var(--surface-2)}
.rank .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .cv{font-weight:600;text-align:right}
.stat{font-size:11px;font-weight:600;border-radius:10px;padding:1px 8px;border:1px solid var(--line-2);white-space:nowrap}
.stat.ok{border-color:#0ca30c;color:var(--ink)}.stat.due{border-color:#fab219}.stat.stale{border-color:#d03b3b;background:#d03b3b18}
.loading{padding:60px;text-align:center;color:var(--ink-2)}
</style>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="wrap">
<header>
  <div>
    <h1>Entry/Exit Board</h1>
    <div class="sub"><span id="nsig"></span> · recomputed on every load · not investment advice</div>
    <div class="fresh" id="fresh">Loading the latest data…</div>
  </div>
  <div class="legendbar" id="scale" aria-label="Score bands, 1 is cheap and 100 is rich"></div>
</header>
<nav id="nav" aria-label="Views">
  <a href="#month">This month</a>
  <a href="#signals">Signal finder</a>
  <a href="#map">Opportunity map</a>
  <a href="#classes">Asset classes</a>
  <a href="#trends">Trends</a>
  <a href="#alerts">Alerts</a>
  <a href="#notes">Design notes</a>
</nav>
<main id="view" tabindex="-1"></main>
</div>
<div class="tt" id="tt"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="drh"></aside>
<script>
(function(){
  const v=document.getElementById('view');v.innerHTML='<div class="loading">Loading the latest readings…</div>';
  fetch('data/signals.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
  .then(d=>{window.__DATA__=d;const s=document.createElement('script');s.src='app.js?t='+Date.now();document.body.appendChild(s)})
  .catch(e=>{v.innerHTML='<div class="loading">Could not load data/signals.json ('+e.message+'). If you opened the file directly, serve the folder instead (for example: python3 -m http.server).</div>'});
})();
</script>
</body>
</html>
