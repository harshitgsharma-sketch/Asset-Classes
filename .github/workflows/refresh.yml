name: Refresh board data

on:
  schedule:
    - cron: "30 1 * * *"     # daily 07:00 IST
  push:
    paths:
      - "models/**"           # the monthly model run commits new inputs here
      - "scripts/**"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy matplotlib
      - name: Commodity price history (World Bank + Yahoo)
        run: python3 -I scripts/fetch_commodity_history.py || echo "commodity history fetch failed; keeping previous file"
      - name: Crypto price history (Yahoo)
        run: python3 -I scripts/fetch_crypto_history.py || echo "crypto history fetch failed; keeping previous file"
      - name: Re-run all 12 oscillators
        run: bash scripts/run_models.sh
      - name: Fetch latest prices (best effort)
        run: python3 -I scripts/fetch_prices.py || echo "price fetch failed; keeping previous prices"
      - name: Market-cap rotation (NSE history in models/nse-history)
        run: python3 -I scripts/size_rotation.py || echo "size rotation failed; keeping previous file"
      - name: Rebuild data/signals.json
        run: python3 -I scripts/build_signals.py
      - name: Sanity check (stops here, without publishing, if the build looks broken)
        run: python3 -I scripts/check_signals.py
      - name: Band-change alerts (GitHub issue; Telegram if its secrets are set)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -I scripts/band_alerts.py || echo "alerts failed; continuing"
      - name: Commit if anything changed
        run: |
          git config user.name "board-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A models data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Refresh board data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
